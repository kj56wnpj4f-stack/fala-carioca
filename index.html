<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fala Carioca</title>
<style>
  :root{
    --bg:#fdf8f0; --card:#ffffff; --ink:#1d2a2a; --muted:#5f6b6b;
    --accent:#0a8f6a; --accent2:#f2b705; --sea:#1b6ca8; --line:#e7e0d3; --hot:#c8402e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111816; --card:#1a2421; --ink:#eef3f1; --muted:#9db0aa;
           --accent:#2fc796; --accent2:#f5c842; --sea:#5aa9e6; --line:#2a3632; --hot:#ff7a63; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{padding:28px 16px 8px;max-width:860px;margin:0 auto}
  h1{margin:0;font-size:28px}
  h1 span{color:var(--accent)}
  h2{font-size:18px;margin:22px 0 10px}
  .sub{color:var(--muted);margin:4px 0 0}
  .bar{max-width:860px;margin:12px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
  .bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);
       padding:7px 13px;border-radius:999px;cursor:pointer;font-size:14px}
  .bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar.levels button.on{background:var(--sea);border-color:var(--sea)}
  .bar.levels button.done::after{content:" ✓"}
  main{max-width:860px;margin:0 auto;padding:16px}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:10px}
  .controls select{max-width:220px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px}
  .progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;min-width:120px}
  .progress>div{height:100%;background:var(--accent);transition:width .3s}
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
  .pill.ai{background:var(--accent);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .pt{font-size:22px;font-weight:700}
  .en{color:var(--muted);margin-top:2px}
  .rows{display:grid;grid-template-columns:140px 1fr auto;gap:8px 12px;margin-top:14px;align-items:center}
  .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .ipa{font-family:ui-monospace,Menlo,monospace}
  .coll{color:var(--sea);font-weight:600}
  .note{margin-top:12px;font-size:14px;color:var(--muted);border-left:3px solid var(--accent2);padding-left:10px}
  .play{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
  .play.alt{background:var(--sea)}
  .play.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:2px 8px}
  .play:disabled{opacity:.6;cursor:wait}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .word{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .word .w{font-size:18px;font-weight:700}
  .word .p{font-size:14px;margin-top:6px}
  .word .alt{font-size:13px;color:var(--muted);margin-top:6px}
  .word .ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}
  .word .ex i{color:var(--muted)}
  .word .btns{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .heat{font-size:13px;white-space:nowrap}
  .heat.l1{color:var(--accent)} .heat.l2{color:var(--accent2)} .heat.l3{color:var(--hot)}
  .quiz .q{font-size:20px;font-weight:600;margin:6px 0 14px}
  .opts{display:grid;gap:8px}
  .opts button{text-align:left;padding:12px;border:1px solid var(--line);background:var(--card);
       color:var(--ink);border-radius:10px;font-size:16px;cursor:pointer}
  .opts button.ok{background:#d6f5e8;border-color:var(--accent);color:#0c4d39}
  .opts button.no{background:#fbe0dc;border-color:#d4553f;color:#7a2416}
  .big{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;margin-top:12px}
  .sounds li{margin-bottom:8px}
  /* Victory overlay */
  #win{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;
       flex-direction:column;z-index:10;cursor:pointer;overflow:hidden;padding:16px;text-align:center}
  #win.show{display:flex}
  #win svg{width:min(420px,90vw);height:auto;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));animation:wave 1.6s ease-in-out infinite}
  #win .msg{color:#FFDF00;font-size:clamp(28px,7vw,52px);font-weight:900;margin-top:22px;
       text-shadow:0 3px 0 #009C3B,0 6px 20px rgba(0,0,0,.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
  #win .hint{color:#fff;opacity:.7;margin-top:12px;font-size:14px}
  .confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
  @keyframes wave{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-6px)}}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media (max-width:560px){ .rows{grid-template-columns:1fr auto} .rows .lbl{grid-column:1 / -1;margin-top:6px} }
</style>
</head>
<body>
<header>
  <h1>Fala <span>Carioca</span></h1>
  <p class="sub">Everyday Brazilian Portuguese, the way it sounds in Rio.</p>
</header>
<div class="bar levels" id="levels"></div>
<div class="bar" id="modes">
  <button data-view="learn" class="on">Learn</button>
  <button data-view="quiz">Quiz</button>
  <button data-view="listen">Listening</button>
  <button data-view="swears">Palavrões</button>
  <button data-view="sounds">Rio sounds</button>
</div>
<main id="app"></main>

<div id="win">
  <svg viewBox="0 0 200 140" aria-label="Brazilian flag">
    <rect width="200" height="140" fill="#009C3B"/>
    <polygon points="100,12 186,70 100,128 14,70" fill="#FFDF00"/>
    <circle cx="100" cy="70" r="34" fill="#002776"/>
    <path d="M67,64 Q100,54 133,76" stroke="#fff" stroke-width="7" fill="none"/>
    <g fill="#fff">
      <circle cx="88" cy="82" r="1.6"/><circle cx="96" cy="88" r="1.4"/><circle cx="105" cy="84" r="1.6"/>
      <circle cx="112" cy="92" r="1.3"/><circle cx="92" cy="96" r="1.3"/><circle cx="118" cy="80" r="1.4"/>
      <circle cx="100" cy="94" r="1.2"/><circle cx="84" cy="74" r="1.2"/>
    </g>
  </svg>
  <div class="msg">Quase Carioca Po**a</div>
  <div class="hint">Tap to continue</div>
</div>

<script type="module">
import { LEVELS, SWEARS, speakable } from "./content.js";

// ---------- STATE (saved in this browser) ----------
const KEY = "fala-carioca-v3";
let state = { level:0, learned:{}, best:{}, voiceName:"", rate:1 };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) state = Object.assign(state, s); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };
if (state.level >= LEVELS.length) state.level = 0;

// ---------- VOICE ----------
// 1st choice: AI Carioca voice via /api/tts (needs OPENAI_API_KEY on Vercel).
// Fallback: the best Brazilian voice installed on this device.
let aiOK = null;               // null = not tried yet, true/false after first try
const audioCache = new Map();
let currentAudio = null;

const isBR = v => v.lang.replace("_","-").toLowerCase() === "pt-br";
function deviceVoices(){
  if (!("speechSynthesis" in window)) return [];
  const score = v => (isBR(v)?10:0) + (/premium|enhanced|natural|neural|online|siri/i.test(v.name)?5:0)
                   + (/luciana|francisca|thalita|google|felipe/i.test(v.name)?2:0);
  return speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().startsWith("pt"))
          .sort((a,b)=>score(b)-score(a));
}
function pickDeviceVoice(){
  const vs = deviceVoices();
  return vs.find(v=>v.name===state.voiceName) || vs[0] || null;
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { if (currentView==="learn") renderVoiceBox(); };

function stopAll(){
  if (currentAudio){ currentAudio.pause(); currentAudio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function deviceSay(text, mode){
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "pt-BR";
  const v = pickDeviceVoice(); if (v) u.voice = v;
  u.rate = state.rate * (mode==="slow" ? 0.75 : 1);
  speechSynthesis.speak(u);
}
async function say(raw, mode="natural", btn){
  const text = speakable(raw);
  stopAll();
  if (aiOK !== false){
    const k = mode + "|" + text;
    try {
      if (btn) btn.disabled = true;
      let url = audioCache.get(k);
      if (!url){
        const r = await fetch(`/api/tts?mode=${mode}&text=${encodeURIComponent(text)}`);
        if (!r.ok){ if (r.status===501 || r.status===404) aiOK = false; throw new Error(r.status); }
        url = URL.createObjectURL(await r.blob());
        audioCache.set(k, url);
      }
      if (aiOK !== true){ aiOK = true; renderVoiceBox(); }
      currentAudio = new Audio(url);
      currentAudio.playbackRate = state.rate;
      await currentAudio.play();
      return;
    } catch(e) {
      if (aiOK === false) renderVoiceBox();
    } finally { if (btn) btn.disabled = false; }
  }
  deviceSay(text, mode);
}

// ---------- HELPERS ----------
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const L = () => LEVELS[state.level];
const lkey = (type,i,lv=state.level) => `${lv}-${type}-${i}`;
const levelTotal = lv => LEVELS[lv].phrases.length + LEVELS[lv].words.length;
const levelLearned = lv =>
  LEVELS[lv].phrases.filter((_,i)=>state.learned[lkey("p",i,lv)]).length +
  LEVELS[lv].words.filter((_,i)=>state.learned[lkey("w",i,lv)]).length;
let currentView = "learn";

function bindPlay(root=app){
  root.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say, b.dataset.mode||"natural", b));
}

function renderLevels(){
  const bar = document.getElementById("levels");
  const hide = currentView==="swears" || currentView==="sounds";
  bar.style.display = hide ? "none" : "flex";
  bar.innerHTML = LEVELS.map((l,i)=>`<button data-l="${i}" class="${i===state.level?"on":""} ${levelLearned(i)===levelTotal(i)?"done":""}">${esc(l.name)}</button>`).join("");
  bar.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    state.level = +b.dataset.l; save(); stopAll(); renderLevels(); views[currentView]();
  });
}

function renderVoiceBox(){
  const box = document.getElementById("voicebox"); if (!box) return;
  if (aiOK === true){
    box.innerHTML = `<span class="pill ai">AI Carioca voice</span>`;
  } else {
    const vs = deviceVoices(), cur = pickDeviceVoice();
    box.innerHTML = `<span class="pill">Device voice</span>` + (vs.length ? ` <select id="voicesel">${
      vs.map(v=>`<option ${cur&&v.name===cur.name?"selected":""}>${esc(v.name)}</option>`).join("")}</select>` : " (no Portuguese voice found)");
    const sel = document.getElementById("voicesel");
    if (sel) sel.onchange = () => { state.voiceName = sel.value; save(); };
  }
}

function controls(){
  const lv = state.level, pct = Math.round(levelLearned(lv)/levelTotal(lv)*100);
  return `<div class="controls"><span><b>${esc(L().name)}</b> · ${esc(L().desc)}</span></div>
  <div class="controls">
    <span>${levelLearned(lv)}/${levelTotal(lv)} learned</span>
    <div class="progress"><div style="width:${pct}%"></div></div>
  </div>
  <div class="controls">
    <span id="voicebox"></span>
    <label>Speed <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${state.rate}"></label>
  </div>`;
}
function bindControls(){
  const r = document.getElementById("rate");
  if (r) r.oninput = e => { state.rate = +e.target.value; save(); };
  renderVoiceBox();
}

// ---------- LEARN ----------
function viewLearn(){
  const lv = L();
  app.innerHTML = controls() + `<h2>5 phrases</h2>` + lv.phrases.map((p,i)=>`
    <div class="card">
      <div class="top">
        <div><div class="pt">${i+1}. ${esc(p.pt)}</div><div class="en">${esc(p.en)}</div></div>
        <label class="chk"><input type="checkbox" data-learn="${lkey("p",i)}" ${state.learned[lkey("p",i)]?"checked":""}> learned</label>
      </div>
      <div class="rows">
        <div class="lbl">Pronunciation (IPA)</div><div class="ipa">${esc(p.ipa)}</div><div></div>
        <div class="lbl">Full</div><div>${esc(p.full)}</div>
          <button class="play" data-say="${esc(p.pt)}" data-mode="slow">▶ slow</button>
        <div class="lbl">Colloquial</div><div><span class="coll">${esc(p.cw)}</span> → ${esc(p.coll)}</div>
          <button class="play alt" data-say="${esc(p.cw)}">▶ natural</button>
      </div>
      <div class="note">${esc(p.note)}</div>
    </div>`).join("")
  + `<h2>10 words</h2><div class="words">` + lv.words.map((w,i)=>`
    <div class="word">
      <div class="top"><div><div class="w">${esc(w.pt)}</div><div class="en">${esc(w.en)}</div></div>
        <label class="chk"><input type="checkbox" data-learn="${lkey("w",i)}" ${state.learned[lkey("w",i)]?"checked":""}></label></div>
      <div class="p"><span class="lbl">Full</span> ${esc(w.full)}</div>
      <div class="p"><span class="lbl">Colloquial</span> ${w.cw ? `<span class="coll">${esc(w.cw)}</span> → ${esc(w.coll)}` : "same"}</div>
      ${w.alt ? `<div class="alt">Also: ${esc(w.alt)}</div>` : ""}
      <div class="btns">
        <button class="play" data-say="${esc(w.pt)}" data-mode="slow">▶ slow</button>
        ${w.cw ? `<button class="play alt" data-say="${esc(w.cw)}">▶ natural</button>` : ""}
      </div>
      <div class="ex">${esc(w.ex)} <button class="play ghost" data-say="${esc(w.ex)}">▶</button><br><i>${esc(w.exEn)}</i></div>
    </div>`).join("") + `</div>`;
  bindControls(); bindPlay();
  app.querySelectorAll("[data-learn]").forEach(c=>c.onchange=()=>{
    state.learned[c.dataset.learn]=c.checked; save(); renderLevels();
    const y = scrollY; viewLearn(); scrollTo(0,y);
  });
}

// ---------- QUIZ / LISTENING ----------
function items(){
  return [
    ...L().phrases.map(p=>({ en:p.en, answer:p.cw, speak:p.cw })),
    ...L().words.map(w=>({ en:w.en, answer:w.pt, speak:w.pt }))
  ];
}
function quizRound(kind){
  const all = items(), order = shuffle(all.map((_,i)=>i));
  let n = 0, score = 0;
  const bestKey = `${state.level}-${kind}`;
  const next = () => {
    if (n >= order.length){
      if (score > (state.best[bestKey]||0)){ state.best[bestKey] = score; save(); }
      app.innerHTML = `<div class="card quiz"><div class="q">Score: ${score}/${order.length}</div>
        <div class="en">Best on this level: ${state.best[bestKey]||0}/${order.length}</div>
        <button class="big" id="again">Play again</button></div>`;
      document.getElementById("again").onclick = () => quizRound(kind);
      if (score === order.length) celebrate();
      return;
    }
    const i = order[n], it = all[i];
    const opts = shuffle([i, ...shuffle(all.map((_,j)=>j).filter(j=>j!==i)).slice(0,3)]);
    const prompt = kind==="listen"
      ? `<button class="big" id="hear">▶ Play again</button><div class="en" style="margin-top:8px">What did you hear?</div>`
      : `<div class="en">How do you say it (casually):</div><div class="q">“${esc(it.en)}”</div>`;
    app.innerHTML = `<div class="card quiz"><div class="en">${esc(L().name)} · ${n+1} / ${order.length} · score ${score}</div>${prompt}
      <div class="opts">${opts.map(j=>`<button data-o="${j}">${esc(kind==="listen"?all[j].en:all[j].answer)}</button>`).join("")}</div></div>`;
    if (kind==="listen"){ document.getElementById("hear").onclick=()=>say(it.speak); say(it.speak); }
    app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      const right = +b.dataset.o === i;
      if (right) score++;
      app.querySelectorAll("[data-o]").forEach(x=>{ x.disabled=true; if(+x.dataset.o===i) x.classList.add("ok"); });
      if (!right) b.classList.add("no");
      if (kind!=="listen") say(it.speak);
      setTimeout(()=>{ n++; next(); }, 1600);
    });
  };
  next();
}

// ---------- VICTORY ----------
function celebrate(){
  const win = document.getElementById("win");
  win.querySelectorAll(".confetti").forEach(c=>c.remove());
  const colors = ["#009C3B","#FFDF00","#002776","#ffffff"];
  for (let k=0;k<80;k++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[k % colors.length];
    c.style.animationDuration = (2 + Math.random()*2.5) + "s";
    c.style.animationDelay = (Math.random()*0.8) + "s";
    win.appendChild(c);
  }
  win.classList.add("show");
}
document.getElementById("win").onclick = () => document.getElementById("win").classList.remove("show");

// ---------- PALAVRÕES ----------
function viewSwears(){
  const heat = l => `<span class="heat l${l}">${"🌶".repeat(l)} ${["","mild","medium","strong"][l]}</span>`;
  app.innerHTML = `<div class="card"><div class="pt">Palavrões</div>
    <div class="en">Brazilian swear words, from harmless to really rude. Cariocas swear a lot and often affectionately,
    but tone and company matter. When in doubt, stick to the mild ones.</div>
    <div class="controls" style="margin-top:10px"><span id="voicebox"></span>
    <label>Speed <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${state.rate}"></label></div></div>
  <div class="words">` + SWEARS.map(s=>`
    <div class="word">
      <div class="top"><div><div class="w">${esc(s.pt)}</div><div class="en">${esc(s.en)}</div></div>${heat(s.lvl)}</div>
      <div class="p"><span class="lbl">Sounds like</span> ${esc(s.full)}</div>
      <div class="btns"><button class="play" data-say="${esc(s.pt)}">▶ play</button></div>
      <div class="ex">${esc(s.ex)} <button class="play ghost" data-say="${esc(s.ex)}">▶</button><br><i>${esc(s.exEn)}</i></div>
      ${s.note ? `<div class="alt">${esc(s.note)}</div>` : ""}
    </div>`).join("") + `</div>`;
  bindControls(); bindPlay();
}

// ---------- RIO SOUNDS ----------
function viewSounds(){
  app.innerHTML = `<div class="card"><div class="pt">What makes Rio sound like Rio</div>
  <ul class="sounds">
    <li><b>S before a consonant or at the end → “sh”.</b> mesmo = “MEZH-moo”, vamos = “VAH-moosh”.</li>
    <li><b>T and D before an “i” sound → “tch” / “dj”.</b> tipo = “CHEE-poo”, onde = “OHN-djee”.</li>
    <li><b>Unstressed final E → “ee”, final O → “oo”.</b> pode = “POH-djee”, tudo = “TOO-doo”.</li>
    <li><b>R at the start, RR, or R before a consonant → breathy “h”.</b> Rio = “HEE-oo”, carro = “KAH-hoo”, porta = “POHH-tah”.</li>
    <li><b>Final R on verbs is dropped.</b> falar → falá, ver → vê.</li>
    <li><b>Final L → “w”.</b> legal = “leh-GOW”, Brasil = “brah-ZEEW”.</li>
    <li><b>Common shortcuts:</b> você → cê, está → tá, estou → tô, para → pra, não → num, não é → né, -ndo → -no.</li>
    <li><b>Reading the respellings:</b> CAPITALS = stressed syllable, “ng” = nasal ending, “hh” = soft breathy R.</li>
  </ul></div>`;
}

const views = { learn:viewLearn, quiz:()=>quizRound("quiz"), listen:()=>quizRound("listen"), swears:viewSwears, sounds:viewSounds };
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#modes button").forEach(x=>x.classList.toggle("on", x===b));
  stopAll();
  currentView = b.dataset.view; renderLevels(); views[currentView]();
});
renderLevels();
viewLearn();
</script>
</body>
</html>
